name: APM

on:
  push:
    paths:
      - .apm-version
      - apm.yml
      - apm.lock.yaml
      - .github/instructions/**
      - .github/prompts/**
      - .github/agents/**
      - .github/mcp.json
      - .github/workflows/apm.yml
      - .agents/**
      - .apm-local/**
  pull_request:
    paths:
      - .apm-version
      - apm.yml
      - apm.lock.yaml
      - .github/instructions/**
      - .github/prompts/**
      - .github/agents/**
      - .github/mcp.json
      - .github/workflows/apm.yml
      - .agents/**
      - .apm-local/**
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup APM
        uses: equisoft-actions/setup-apm@v1.0.0
        with:
          app-id: ${{ vars.APM_APP_ID }}
          private-key: ${{ secrets.APM_APP_PRIVATE_KEY }}
      - name: APM audit
        run: apm audit --ci --no-cache
